  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons:
  fluttertoast:
  bloc_test:
  badges:
  flutter_otp_text_field:
  google_fonts: ^6.2.1
  row_item:
  radial_progress: ^0.1.0
  dio:
  http:
  retrofit:
  logger:   # for logging purpose
  pretty_dio_logger:
  json_annotation:
  flutter_screenutil:
  shared_preferences: ^2.5.1
  build_runner:
  flutter_gemini: ^3.0.0
  url_launcher: ^6.3.1
  flutter_dotenv:
  youtube_player_flutter: ^9.1.1

  # Ui
  lottie:
  flutter_hooks:
  equatable:
  shimmer:
  flutter_spinkit: ^5.2.1
  animated_text_kit:
  flutter_image_slideshow:
  add_to_cart_animation:
  auto_size_text:
  image_picker:
  animate_do:
  another_stepper: ^1.2.2
  glassmorphism_ui: ^0.3.0
  awesome_snackbar_content:
  connectivity_plus:
  cached_network_image: ^3.4.1



  # add injectable to your dependencies
  injectable:
  get_it:

  # state Manager
  flutter_bloc:
  flutter_svg:
  bloc:
  geolocator: ^13.0.2   # For location services and permissions
  geocoding: ^3.0.0
  isar: ^3.0.0
  path_provider: ^2.1.5
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_intl:
  flutter_lints:
  injectable_generator:
  retrofit_generator:
  json_serializable:
  dartz:
  test:
  flutter_native_splash: ^2.4.4
  icons_launcher: ^3.0.0
  mockito:
  isar_generator: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true


  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/fonts/
    - assets/json/
    - assets/svg/
    - .env.appKeys
    - lib/generated/assets.dart
    - translations/ar.json
    - translations/en.json
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: BalooThambi2
      fonts:
        - asset: assets/fonts/BalooThambi2-Regular.ttf
          weight: 300
        - asset: assets/fonts/BalooThambi2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooThambi2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooThambi2-SemiBold.ttf
          weight: 600